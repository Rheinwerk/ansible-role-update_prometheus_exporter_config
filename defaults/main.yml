---
# List of exporters to configure
# Each exporter:
#   name: (required) service name (e.g., systemd_exporter)
#   listen_address: (optional) default: 127.0.0.1
#   listen_port: (optional) listen port; if set, --web.listen-address is added automatically
#   extra_args: (optional) list of additional arguments
#   env_vars: (optional) dict of environment variables
#   binary_dir: (optional) path to binary, omit for default location
#   config_content: (optional) content for /etc/<name>/config.yml
#
# Example:
# _prometheus_exporter_configs:
#   - name: systemd_exporter
#     listen_port: "9558"
#     extra_args:
#       - "--systemd.collector.unit-include=ssh\\.service"
#   - name: mysqld_exporter
#     listen_port: "9104"
#     env_vars:
#       MYSQLD_EXPORTER_PASSWORD: "{{ password_var }}"
#     extra_args:
#       - "--mysqld.username=monitoring"
#   - name: process-exporter
#     listen_port: "9256"
#     extra_args:
#       - "--config.path=/etc/process-exporter/config.yml"
#     config_content: |
#       process_names:
#         - name: "{{.Comm}}"
#           comm:
#             - nginx

_prometheus_exporter_configs: []

# x509-certificate-exporter (cert-expiry metrics) is expected to already be
# installed -- disabled -- by the baseimage, on every consumer of this role.
# This role always appends a config for it to _prometheus_exporter_configs
# (see tasks/main.yml) unless manage is set to false.
x509_certificate_exporter:
  manage: true
  listen_address: "127.0.0.1:9793"
  refresh_interval: "24h"
  # Reuse the existing glob file scollector's external collector reads.
  cert_glob_file: "/etc/cert_exp_time_globs"
