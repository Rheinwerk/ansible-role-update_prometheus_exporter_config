---
# x509-certificate-exporter (cert-expiry metrics) is expected to already be
# installed -- disabled -- by the baseimage, on every consumer of this role.
# Render its config from a cert-glob file (paths to watch, one glob per
# line) and let the loop below start it via the usual drop-in mechanism.
# Set x509_certificate_exporter.manage to false to opt out (e.g. a
# host/consumer that doesn't have the exporter).
- name: Compute x509-certificate-exporter config content from cert glob file
  ansible.builtin.set_fact:
    _x509_certificate_exporter_config_content: |
      server:
        listen: "{{ x509_certificate_exporter.listen_address }}"
      sources:
        - kind: file
          name: host-pki
          refreshInterval: {{ x509_certificate_exporter.refresh_interval }}
          paths:
      {% for _line in (lookup('file', x509_certificate_exporter.cert_glob_file, errors='ignore') | default('', true)).splitlines() %}
      {% set _glob = _line.strip() %}
      {% if _glob and not _glob.startswith('#') and not _glob.endswith('.properties') %}
            - "{{ _glob }}"
      {% endif %}
      {% endfor %}
  when: x509_certificate_exporter.manage

- name: Extend _prometheus_exporter_configs with x509-certificate-exporter
  ansible.builtin.set_fact:
    _prometheus_exporter_configs: "{{ (_prometheus_exporter_configs | default([])) + [_x509_certificate_exporter_entry] }}"
  vars:
    _x509_certificate_exporter_entry:
      name: x509-certificate-exporter
      config_content: "{{ _x509_certificate_exporter_config_content }}"
      extra_args:
        - "--config"
        - "/etc/x509-certificate-exporter/config.yml"
  when: x509_certificate_exporter.manage

- name: Configure exporters
  ansible.builtin.include_tasks: configure_exporter.yml
  loop: "{{ _prometheus_exporter_configs }}"
  loop_control:
    loop_var: _exporter
    label: "{{ _exporter.name }}"
