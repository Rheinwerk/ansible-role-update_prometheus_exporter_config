---
# Loop items end up in the output and in the ASP simulation JSON, so the loop runs over the list
# positions and not over the configs, which can carry passwords (CDINFRA-1262)
- name: Configure exporters
  ansible.builtin.include_tasks: configure_exporter.yml
  loop: "{{ range(_prometheus_exporter_configs | length) | list }}"
  loop_control:
    loop_var: _exporter_index
    label: "{{ _prometheus_exporter_configs[_exporter_index].name }}"
  vars:
    _exporter: "{{ _prometheus_exporter_configs[_exporter_index] }}"
